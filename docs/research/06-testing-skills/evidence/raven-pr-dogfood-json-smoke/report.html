function evidence(ids){const grid=el('div','media-grid');[...new Set(ids)].forEach(id=>{const e=ev.get(id);if(!e)throw Error('找不到证据 '+id);const card=el('div','evidence'),path=safePath(e.path);

 else if(e.kind==='video'){const video=el('video');video.src=path;video.controls=true;video.preload='none';video.setAttribute('aria-label',e.note);card.append(video)}
 else{const a=el('a','log-link');a.href=path;a.target='_blank';a.rel='noopener';a.append(el('span','log-icon','↗'),el('span','',e.note));card.append(a)}
 const info=el('div','evidence-info');const a=el('a','mono',e.id);a.href=path;a.target='_blank';a.rel='noopener';info.append(a,el('div','',e.note),el('div','',`${e.kind} · ${e.bytes<1024?e.bytes+' B':(e.bytes/1024).toFixed(1)+' KB'} · 轮次 ${e.epoch}${e.current?'':' · 历史证据'}`));card.append(info);grid.append(card)});return grid}
function pair(label,value){const b=el('div','box');b.append(el('div','label',label),para(value));return b}
function attempts(items){const box=el('div');items.forEach(a=>{const item=el('div','attempt');item.append(badge(a.outcome),el('span','muted small',`  尝试 ${a.index}`),para(a.actual),evidence(a.evidence_ids));box.append(item)});return box}
function detail(title,id,status,priority,body){const card=el('details','card');card.open=expanded;const sum=el('summary'),head=el('div','case-heading'),badges=el('div','badges');head.append(el('span','case-id',id),el('span','case-title',title));if(priority)badges.append(el('span','badge priority',labels[priority]||priority));badges.append(badge(status));sum.append(head,badges);card.append(sum,body);return card}
function scenarioCard(c){const body=el('div','details-body'),grid=el('div','grid2');grid.append(pair('预期结果',c.expected),pair('预期依据',c.oracle));body.append(grid);if(c.preconditions.length)body.append(el('h4','','测试前提'),list(c.preconditions));body.append(el('h4','','操作步骤'),list(c.steps,true));if(c.result){const r=c.result;if(!c.current)body.append(para('旧版本结果已失效，以下记录保留供追溯。','notice'));body.append(el('h4','','实际观察'),para(r.summary));if(r.reason)body.append(para(r.reason,'notice'));body.append(attempts(r.attempts));r.evidence_gaps.forEach(g=>body.append(para(`${g.kind} 证据缺口：${g.reason}`,'notice')));r.advisories.forEach(a=>body.append(pair('改进建议 · 不计功能失败',a.summary),evidence(a.evidence_ids)))}else body.append(para('尚未记录实际测试结果。','muted'));body.append(el('h4','','关联改动'),list(c.changed_files));return detail(c.title,c.id,c.status,'优先级 '+({critical:'关键',high:'高',normal:'常规'}[c.priority]),body)}
function findingCard(f){const body=el('div','details-body');body.append(pair('问题描述',f.summary));const grid=el('div','grid2');grid.append(pair('预期',f.expected),pair('依据与归属',f.oracle+' · '+({introduced:'本次引入',preexisting:'原有问题',unknown:'归属待确认'}[f.attribution])));body.append(grid,el('h4','','复现步骤'),list(f.steps,true),attempts(f.attempts));f.repair_ids.forEach(id=>{const r=report.repairs.find(x=>x.id===id);if(r){const b=el('div','box');b.append(el('h4','','修复说明'),para(r.summary),el('div','label','根因'),para(r.root_cause),el('div','label','修复文件'),list(r.files),para(`回归命令：${r.before_command_id||'视觉复查'} → ${r.after_command_id||'实际截图复查'}`,'mono'));if(r.visual_reason)b.append(para(r.visual_reason,'notice'));body.append(b)}});return detail(f.title,f.scenario_id+' · '+f.id,f.resolution,f.severity||'unspecified',body)}
function table(headers,rows){const outer=el('div','card table-wrap'),t=el('table','table'),head=el('thead'),tr=el('tr');headers.forEach(h=>tr.append(el('th','',h)));head.append(tr);t.append(head);const body=el('tbody');rows.forEach(row=>{const tr=el('tr');row.forEach(v=>{const td=el('td');if(v instanceof Node)td.append(v);else td.textContent=String(v);tr.append(td)});body.append(tr)});t.append(body);outer.append(t);return outer}
function commandRows(){return report.commands.filter(c=>JSON.stringify(c).toLowerCase().includes($('search').value.toLowerCase())).map(c=>{const cmd=el('div','cmd',c.argv.join(' '));const phase=el('div');phase.append(para(c.phase,'small'),el('span','muted small',c.current?'当前轮次':'历史轮次'));const link=el('span','muted','未完成');if(c.evidence_id){const a=el('a','', '查看日志');a.href=safePath(ev.get(c.evidence_id).path);a.target='_blank';a.rel='noopener';link.replaceChildren(a)}return[c.id,c.scenario_id||'—',phase,cmd,c.exit_code===null?'未完成':c.exit_code,link]})}
function coverage(){const out=el('div'),grid=el('div','grid2'),left=el('section','panel'),right=el('section','panel');left.append(el('h2','','改动覆盖'));if(report.target.description)left.append(pair('PR 说明',report.target.description));left.append(para((report.target.base_ref||'base')+' → '+(report.target.head_ref||'head'),'small muted'));report.coverage.changed_files.forEach(p=>left.append(el('div','file',p)));report.coverage.exclusions.forEach(e=>left.append(pair('排除 · '+e.path,e.reason)));if(report.coverage.unmapped_files.length)left.append(para('未关联测试：'+report.coverage.unmapped_files.join('、'),'notice'));left.append(pair('验证范围',report.summary.scope),el('h4','','代码版本'),pair('比较起点',report.target.base_commit),pair('PR 提交',report.target.head_commit),pair('实际被测提交',report.target.tested_commit),pair('工作区指纹',report.target.code_fingerprint));right.append(el('h2','','被测环境'));if(report.environment){const e=report.environment;right.append(pair('浏览器与地址',e.browser+' · '+(e.url||'非浏览器场景')),pair('服务身份依据',e.identity_proof),pair('测试数据与替身',e.dataset),para('能力：'+e.capabilities.join(' / '),'small muted'),evidence(e.evidence_ids))}else right.append(para('尚未确认环境','notice'));grid.append(left,right);out.append(grid);const warnings=el('section','panel');warnings.append(el('h2','','未验证项与记录检查'));const gaps=[...report.checks.errors,...report.checks.gaps];warnings.append(gaps.length?list(gaps):para('本轮记录检查未发现缺口。仍需结合声明范围判断覆盖是否充分。','notice good-note'));out.append(warnings);const flows=el('section','panel');flows.append(el('h2','','用户旅程'));report.flows.forEach(f=>flows.append(el('h4','',f.title),list(f.steps,true),para('终态：'+f.expected_end,'muted small')));out.append(flows);if(report.timeline.length){const section=el('section','panel');section.append(el('h2','','历史与恢复'));const timeline=el('div','timeline');report.timeline.forEach(t=>{const item=el('div','timeline-item');item.append(el('div','label',t.at),el('strong','',t.event),para(t.summary,'small'));timeline.append(item)});section.append(timeline);out.append(section)}return out}
function draw(){const content=$('content');content.replaceChildren();const query=$('search').value.toLowerCase(),status=$('status-filter').value,severity=$('severity-filter').value;$('status-filter').classList.toggle('hidden',tab!=='scenarios');$('severity-filter').classList.toggle('hidden',tab!=='findings');$('toolbar').classList.toggle('hidden',tab==='coverage');$('expand').classList.toggle('hidden',!['scenarios','findings'].includes(tab));document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));if(tab==='scenarios'){const items=report.scenarios.filter(c=>(!status||c.status===status)&&JSON.stringify(c).toLowerCase().includes(query));items.forEach(c=>content.append(scenarioCard(c)));if(!items.length)content.append(empty('没有匹配的测试场景'))}else if(tab==='findings'){const items=report.findings.filter(f=>(!severity||(f.severity||'unspecified')===severity)&&JSON.stringify(f).toLowerCase().includes(query));items.forEach(f=>content.append(findingCard(f)));if(!items.length)content.append(empty('没有匹配的问题记录'))}else if(tab==='commands'){const rows=commandRows();content.append(rows.length?table(['命令 ID','场景','阶段','实际命令','退出码','证据'],rows):empty('没有匹配的执行记录'))}else content.append(coverage())}
try{report=JSON.parse($('report-data').textContent);if(report.schema_version!=='1.0.0')throw Error('不支持的报告版本');report.evidence.forEach(e=>{safePath(e.path);ev.set(e.id,e)});const s=report.summary,t=report.target;document.title='Raven · '+t.repository+' 测试报告';$('title').textContent=t.repository+(t.pr_number?' · PR #'+t.pr_number:' · 改动测试');$('target').textContent=t.title||report.metadata.title;$('report-id').textContent=report.metadata.report_id;const v=verdicts[s.verdict];$('verdict').textContent=v[0];$('verdict').classList.add(v[1]);['测试版本 '+t.tested_commit.slice(0,10),'轮次 '+t.epoch,(report.metadata.mode==='repair'?'测试与修复':'测试与报告'),(t.dirty?'包含已记录的未提交修复':'已固定提交')].forEach(x=>$('meta').append(el('span','',x)));[['测试场景',s.total,'声明范围内的场景总数'],['当前通过',s.status_counts.pass,'未验证和过期结果不计通过'],['发现问题',s.findings_total,'保留修复前与历史发现'],['已修复',s.resolved_findings,'具备当前复查和修复证明']].forEach(([label,value,sub])=>{const n=el('div','stat');n.append(el('div','muted small',label),el('div','value',value),el('div','sub',sub));$('stats').append(n)});const title=el('div','progress-title');title.append(el('span','','场景执行分布'),el('span','muted',`${s.status_counts.pass} / ${s.total} 当前通过`));const bar=el('div','progress'),legend=el('div','legend');Object.entries(s.status_counts).forEach(([k,n])=>{if(!n)return;const seg=el('div','segment');seg.style.width=(s.total?n/s.total*100:0)+'%';seg.style.background=colors[k];seg.title=labels[k]+' '+n;bar.append(seg);const entry=el('span'),dot=el('i','dot');dot.style.background=colors[k];entry.append(dot,document.createTextNode(labels[k]+' '+n));legend.append(entry)});$('progress').append(title,bar,legend);[['scenarios','测试场景',s.total],['findings','问题与修复',s.findings_total],['commands','命令记录',report.commands.length],['coverage','覆盖与环境',null]].forEach(([key,label,count])=>{const b=el('button','tab',label);b.type='button';b.dataset.tab=key;b.setAttribute('role','tab');if(count!==null)b.append(el('span','count',count));b.onclick=()=>{tab=key;draw()};$('tabs').append(b)});Object.keys(s.status_counts).forEach(k=>$('status-filter').append(new Option(labels[k],k)));['critical','high','medium','low','unspecified'].forEach(k=>$('severity-filter').append(new Option(labels[k],k)));$('search').oninput=draw;$('status-filter').onchange=draw;$('severity-filter').onchange=draw;$('expand').onclick=()=>{expanded=!expanded;$('expand').textContent=expanded?'收起全部':'展开全部';draw()};$('print').onclick=()=>{document.querySelectorAll('details').forEach(d=>d.open=true);window.print()};$('close-image').onclick=()=>$('lightbox').close();$('lightbox').onclick=e=>{if(e.target===$('lightbox'))$('lightbox').close()};$('download-json').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));const a=el('a');a.href=url;a.download='report.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('generated').textContent='生成于 '+new Date(report.metadata.generated_at).toLocaleString('zh-CN')+' · Schema '+report.schema_version;draw()}catch(error){$('app').replaceChildren(el('div','error','报告加载失败：'+error.message))}
</script>
