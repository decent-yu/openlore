<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="466" viewBox="0 0 1280 466" role="img" aria-labelledby="title desc">
  <title id="title">OpenLore：从技术信息到团队知识</title>
  <desc id="desc">来源采集进入内容池，AI 生成共享初审结果，流水线按主题批量选文并深度调研，最终归档到 GitHub 并推送到团队群。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0 6 3.5 0 7" fill="none" stroke="#94a3b8" stroke-width="1.5"/></marker>
  </defs>
  <rect x="1" y="1" width="1278" height="464" rx="24" fill="url(#bg)" stroke="#e2e8f0"/>
  <g font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif'>
    <text x="48" y="53" font-size="14" font-weight="700" letter-spacing="2" fill="#6366f1">OPENLORE / KNOWLEDGE WORKSPACE</text>
    <text x="48" y="112" font-size="40" font-weight="700" letter-spacing="-1" fill="#0f172a">从技术信息，到团队知识。</text>
    <text x="48" y="149" font-size="18" fill="#64748b">持续发现值得读的内容，理解它，再沉淀为团队可复用的知识。</text>
    <g transform="translate(48 190)">
      <rect width="272" height="184" rx="16" fill="#fff" stroke="#e2e8f0"/>
      <rect x="20" y="20" width="42" height="42" rx="12" fill="#eff6ff"/>
      <g transform="translate(31 31)" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 15a2 2 0 1 0 0 .1M1 8a9 9 0 0 1 9 9M1 1a16 16 0 0 1 16 16"/></g>
      <text x="247" y="46" text-anchor="end" font-size="13" fill="#94a3b8">01</text>
      <text x="20" y="96" font-size="23" font-weight="650" fill="#0f172a">采集入池</text>
      <text x="20" y="129" font-size="16" fill="#475569">订阅技术来源</text>
      <text x="20" y="156" font-size="14" fill="#64748b">统一收集正文与出处</text>
    </g>
    <path d="M329 282h14" fill="none" stroke="#94a3b8" stroke-width="1.7" marker-end="url(#arrow)"/>
    <g transform="translate(352 190)">
      <rect width="272" height="184" rx="16" fill="#fff" stroke="#e2e8f0"/>
      <rect x="20" y="20" width="42" height="42" rx="12" fill="#eef2ff"/>
      <g transform="translate(31 31)" fill="none" stroke="#4f46e5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2h11l4 4v13H3zM13 2v5h5M7 12l3 3 5-6"/></g>
      <text x="247" y="46" text-anchor="end" font-size="13" fill="#94a3b8">02</text>
      <text x="20" y="96" font-size="23" font-weight="650" fill="#0f172a">共享初审</text>
      <text x="20" y="129" font-size="16" fill="#475569">评分、定位与主题标签</text>
      <text x="20" y="156" font-size="14" fill="#64748b">同一份结果供多个任务复用</text>
    </g>
    <path d="M633 282h14" fill="none" stroke="#94a3b8" stroke-width="1.7" marker-end="url(#arrow)"/>
    <g transform="translate(656 190)">
      <rect width="272" height="184" rx="16" fill="#fff" stroke="#e2e8f0"/>
      <rect x="20" y="20" width="42" height="42" rx="12" fill="#f5f3ff"/>
      <g transform="translate(31 31)" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="m13 13 6 6M5 8h6M8 5v6"/></g>
      <text x="247" y="46" text-anchor="end" font-size="13" fill="#94a3b8">03</text>
      <text x="20" y="96" font-size="23" font-weight="650" fill="#0f172a">主题调研</text>
      <text x="20" y="129" font-size="16" fill="#475569">AI 批量选文，最多 M 篇</text>
      <text x="20" y="156" font-size="14" fill="#64748b">读取全文，解释机制与取舍</text>
    </g>
    <path d="M937 282h14" fill="none" stroke="#94a3b8" stroke-width="1.7" marker-end="url(#arrow)"/>
    <g transform="translate(960 190)">
      <rect width="272" height="184" rx="16" fill="#fff" stroke="#e2e8f0"/>
      <rect x="20" y="20" width="42" height="42" rx="12" fill="#ecfdf5"/>
      <g transform="translate(31 31)" fill="none" stroke="#059669" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 5h7l2 3h10v12H1zM11 11v6M8 14l3 3 3-3"/></g>
      <text x="247" y="46" text-anchor="end" font-size="13" fill="#94a3b8">04</text>
      <text x="20" y="96" font-size="23" font-weight="650" fill="#0f172a">归档与汇报</text>
      <text x="20" y="129" font-size="16" fill="#475569">GitHub 归档，Wiki 阅读</text>
      <text x="20" y="156" font-size="14" fill="#64748b">简明日报推送到飞书 / Lark</text>
    </g>
    <path d="M48 404h1184" stroke="#dbe2ee"/>
    <text x="48" y="438" font-size="15" fill="#64748b">共享一次初审，服务多个研究主题。</text>
    <text x="1232" y="438" text-anchor="end" font-size="15" font-weight="600" fill="#6366f1">Codex CLI / Gemini CLI</text>
  </g>
</svg>
