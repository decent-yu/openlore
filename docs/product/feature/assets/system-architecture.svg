<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1460" viewBox="0 0 1520 1460" role="img" aria-labelledby="title desc">
<title id="title">OpenLore 本地知识采集与研究工作台</title>
<desc id="desc">工作区预配置仓库凭据和本地 AI，管理员维护来源，用户按组配置筛选与归档路由。常驻调度发现条目，按组挑选候选，Codex 或 Gemini 处理文章并开展有限引用扩展研究。结果形成原文、分析、简报与研究文件，更新 GitHub 后可选通知，持久队列负责恢复。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#65748b"/></marker></defs>
<style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}.title{font-size:31px;font-weight:700;fill:#142b43}.head{font-size:24px;font-weight:650;fill:#172d46}.body{font-size:18px;fill:#354962}.small{font-size:16px;fill:#62728a}.code{font-family:Menlo,Consolas,monospace;font-size:17px;fill:#354962}.arrow{fill:none;stroke:#65748b;stroke-width:2.5;marker-end:url(#arrow)}</style>
<rect width="1520" height="1460" fill="#f4f7fc"/>

<text x="40" y="53" class="title">OpenLore · 本地知识采集与研究工作台</text>
<text x="40" y="85" class="body">一次配置连接，按组配置路由；持续采集、提炼与研究，最终以文件形式更新 GitHub。</text>
<rect x="40" y="125" width="440" height="195" rx="16" fill="white" stroke="#d7e0ed" stroke-width="1.5"/>
<rect x="40" y="143" width="5" height="32" rx="2" fill="#3579cb"/>
<text x="63" y="167" class="head">01 · 工作区连接</text>
<text x="63" y="206" class="body">GitHub 仓库 / 分支 / Token 保存一次</text>
<text x="63" y="237" class="body">通知连接与本地 Codex / Gemini 配置</text>
<text x="63" y="268" class="body">初始测试通过，各组选择连接引用</text>
<rect x="540" y="125" width="440" height="195" rx="16" fill="white" stroke="#d7e0ed" stroke-width="1.5"/>
<rect x="540" y="143" width="5" height="32" rx="2" fill="#3579cb"/>
<text x="563" y="167" class="head">01 · 管理员：信息源</text>
<text x="563" y="206" class="body">说明内容定位，配置采集入口与预算</text>
<text x="563" y="237" class="body">首期 Cloudflare + Simon Willison</text>
<text x="563" y="268" class="body">RSS/Atom 与 Web 文章能力独立封装</text>
<rect x="1040" y="125" width="440" height="195" rx="16" fill="white" stroke="#d7e0ed" stroke-width="1.5"/>
<rect x="1040" y="143" width="5" height="32" rx="2" fill="#8056c5"/>
<text x="1063" y="167" class="head">01 · 用户：采集组</text>
<text x="1063" y="206" class="body">名称、来源、关键词、偏好与运行计划</text>
<text x="1063" y="237" class="body">仓库连接 → /docs/agent-leaning</text>
<text x="1063" y="268" class="body">组规则勾选：批次简报 / 逐篇深度调研</text>
<path d="M260 320 V365" class="arrow"/>
<path d="M760 320 V365" class="arrow"/>
<path d="M1260 320 V365" class="arrow"/>
<rect x="40" y="365" width="1440" height="60" rx="12" fill="#e7edf8"/>
<text x="65" y="402" class="body">本地常驻服务 · Web 管理界面 + 调度器 + SQLite 持久队列 · 来源默认每 30 分钟轮询，组默认每日 09:00 运行</text>
<path d="M260 425 V480" class="arrow"/>
<rect x="40" y="480" width="440" height="235" rx="16" fill="white" stroke="#d7e0ed" stroke-width="1.5"/>
<rect x="40" y="498" width="5" height="32" rx="2" fill="#258b77"/>
<text x="63" y="522" class="head">02 · 发现与共享采集</text>
<text x="63" y="561" class="body">来源元信息、原文链接、更新标识</text>
<text x="63" y="592" class="body">304 / 分页快照 / 去重与断点续采</text>
<text x="63" y="623" class="body">按候选需要获取正文并保存证据</text>
<text x="63" y="654" class="body">失败单源可恢复，正文可跨组复用</text>
<rect x="540" y="480" width="440" height="235" rx="16" fill="white" stroke="#d7e0ed" stroke-width="1.5"/>
<rect x="540" y="498" width="5" height="32" rx="2" fill="#8056c5"/>
<text x="563" y="522" class="head">02 · 按组挑选候选</text>
<text x="563" y="561" class="body">首次近 7 天；后续增量与积压</text>
<text x="563" y="592" class="body">多来源轮转取数，默认评估 20 篇</text>
<text x="563" y="623" class="body">区分重复、窗外、正文失败与延后</text>
<text x="563" y="654" class="body">达到上限的内容保留到后续批次</text>
<rect x="1040" y="480" width="440" height="235" rx="16" fill="white" stroke="#d7e0ed" stroke-width="1.5"/>
<rect x="1040" y="498" width="5" height="32" rx="2" fill="#8056c5"/>
<text x="1063" y="522" class="head">03 · 本地 AI + Skills</text>
<text x="1063" y="561" class="body">Codex CLI / Gemini CLI，任选其一</text>
<text x="1063" y="592" class="body">逐任务启动，复用本人登录与模型</text>
<text x="1063" y="623" class="body">Skills 负责分类、评估与文章整理</text>
<text x="1063" y="654" class="body">默认最多入选 10 篇，生成中文分析</text>
<path d="M480 595 H540" class="arrow"/>
<path d="M980 595 H1040" class="arrow"/>
<path d="M260 715 V810" class="arrow"/>
<path d="M1130 715 V765 H760 V810" class="arrow"/>
<text x="785" y="754" class="small">常规文章处理产物</text>
<path d="M1260 715 V810" class="arrow"/>
<text x="1276" y="765" class="small">勾选后逐篇执行</text>
<rect x="40" y="810" width="440" height="240" rx="16" fill="white" stroke="#d7e0ed" stroke-width="1.5"/>
<rect x="40" y="828" width="5" height="32" rx="2" fill="#258b77"/>
<text x="63" y="852" class="head">持久状态与恢复</text>
<text x="63" y="891" class="body">来源、文章版本与组内处理记录</text>
<text x="63" y="922" class="body">运行快照、任务租约、积压与预算</text>
<text x="63" y="953" class="body">额度 / 认证问题保留为 blocked</text>
<text x="63" y="984" class="body">重启续跑，Git 与消息独立恢复</text>
<text x="63" y="1015" class="body">每条内容都有结果与原因</text>
<rect x="540" y="810" width="440" height="240" rx="16" fill="white" stroke="#d7e0ed" stroke-width="1.5"/>
<rect x="540" y="828" width="5" height="32" rx="2" fill="#8056c5"/>
<text x="563" y="852" class="head">03 → 04 · 固定文件包</text>
<text x="563" y="891" class="body">逐篇：article.md + assets/</text>
<text x="563" y="922" class="body">归档：日期批次 / 文章主题</text>
<text x="563" y="953" class="body">可选：research.md / digest.md</text>
<text x="563" y="984" class="body">稳定 ID 和路径，变化时更新</text>
<text x="563" y="1015" class="body">图片全部本地化，关闭选项不建文件</text>
<rect x="1040" y="810" width="440" height="240" rx="16" fill="white" stroke="#d7e0ed" stroke-width="1.5"/>
<rect x="1040" y="828" width="5" height="32" rx="2" fill="#8056c5"/>
<text x="1063" y="852" class="head">03 · 基于文章深入调研</text>
<text x="1063" y="891" class="body">唯一主文章，逐篇独立任务</text>
<text x="1063" y="922" class="body">最多读取 6 个真实引用页，深度 1</text>
<text x="1063" y="953" class="body">规划 → 取证 → 综合 → 引用校验</text>
<text x="1063" y="984" class="body">15 分钟预算，区分事实 / 推断 / 缺口</text>
<text x="1063" y="1015" class="body">报告与正文放一起，不阻塞文章发布</text>
<path d="M1040 935 H980" class="arrow"/>
<path d="M760 1050 V1150" class="arrow"/>
<text x="785" y="1103" class="small">应用校验路径与文件后写入</text>
<rect x="40" y="1150" width="440" height="200" rx="16" fill="white" stroke="#d7e0ed" stroke-width="1.5"/>
<rect x="40" y="1168" width="5" height="32" rx="2" fill="#258b77"/>
<text x="63" y="1192" class="head">可见、可操作的工作台</text>
<text x="63" y="1231" class="body">设置 / 来源 / 采集组 / 运行</text>
<text x="63" y="1262" class="body">内容库 / 调研 / 逐阶段重试</text>
<text x="63" y="1293" class="body">AI 不持有 GitHub Token</text>
<rect x="540" y="1150" width="440" height="200" rx="16" fill="white" stroke="#d7e0ed" stroke-width="1.5"/>
<rect x="540" y="1168" width="5" height="32" rx="2" fill="#3579cb"/>
<text x="563" y="1192" class="head">04 · GitHub 文件同步</text>
<text x="563" y="1231" class="body">读取预配置连接，按组路由写入</text>
<text x="563" y="1262" class="body">新增 / 更新，一批一个提交</text>
<text x="563" y="1293" class="body">核对冲突与结果，保留其他文件</text>
<rect x="1040" y="1150" width="440" height="200" rx="16" fill="white" stroke="#d7e0ed" stroke-width="1.5"/>
<rect x="1040" y="1168" width="5" height="32" rx="2" fill="#3579cb"/>
<text x="1063" y="1192" class="head">04 · 可选消息通知</text>
<text x="1063" y="1231" class="body">Git 成功后发送通用 JSON Webhook</text>
<text x="1063" y="1262" class="body">简报 / 调研链接 + 数量与状态</text>
<text x="1063" y="1293" class="body">相同事件固定 ID，失败只补发消息</text>
<path d="M980 1250 H1040" class="arrow"/>
<text x="40" y="1407" class="small">独立能力目录：web_feed · web_page · media_assets · codex_cli · gemini_cli · github · generic_webhook；通过统一协议接入。</text>
<text x="40" y="1433" class="small">当前为可实施设计与虚拟产物示例，尚未构建运行服务；本地调度不代表模型离线运行或账号额度无限。</text>
</svg>