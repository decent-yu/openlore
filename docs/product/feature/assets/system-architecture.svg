<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img" aria-labelledby="title desc">
  <title id="title">OpenLore 系统架构：云端控制服务与独立 AI Runner</title>
  <desc id="desc">浏览器访问云端网站。云端单实例运行采集、Python 解析、内容池、计划编排、SQLite AI 队列与结果校验归档。用户电脑只运行独立 Runner，通过出站 HTTPS 主动领取任务、心跳续租、回传产物，按需调用已登录的 Codex 或 Gemini CLI。不需要在 Runner 电脑上运行 npm run dev。图底部列出独立发行包、设备注册和重启恢复等尚未实现的能力。</desc>
  <defs>
    <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#456bc8"/></marker>
    <marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#168570"/></marker>
  </defs>
  <style>
    text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#21334c}
    .title{font-size:34px;font-weight:700}.sub{font-size:18px;fill:#56677f}.head{font-size:24px;font-weight:650}.label{font-size:20px;font-weight:600}.body{font-size:17px}.small{font-size:15px;fill:#56677f}.mono{font-family:Menlo,Consolas,monospace;font-size:16px}
    .flow{stroke:#456bc8;stroke-width:2.4;fill:none;marker-end:url(#blue)}.return{stroke:#168570;stroke-width:2.4;fill:none;marker-end:url(#green)}.box{fill:white;stroke:#d1dced;stroke-width:1.4}
  </style>
  <rect width="1600" height="1130" fill="#f5f7fb"/>
  <text x="50" y="60" class="title">OpenLore · 云端编排，Runner 执行</text>
  <text x="50" y="96" class="sub">标准部署 / 当前 Worker 主链路 · 控制服务与执行进程独立运行 · 核对日期 2026-10-17</text>

  <rect x="50" y="133" width="1500" height="77" rx="14" class="box"/>
  <text x="78" y="166" class="label">浏览器 · 云端工作台</text>
  <text x="78" y="191" class="small">来源与计划配置 / 运行状态 / 调用日志 / 成果阅读</text>
  <text x="915" y="176" class="body">关闭网页后，云端计划与 Runner 继续运行</text>
  <text x="380" y="239" class="small">HTTPS · API / 页面状态</text>

  <rect x="50" y="265" width="820" height="650" rx="20" fill="#edf3ff" stroke="#bbccec" stroke-width="1.5"/>
  <text x="78" y="300" class="head">云端控制服务</text>
  <text x="542" y="300" class="small">单实例 Node 服务 + Python</text>
  <path d="M365 210 V325" class="flow"/>
  <rect x="80" y="325" width="330" height="100" rx="12" class="box"/>
  <text x="100" y="359" class="label">网站 / 管理 API</text>
  <text x="100" y="388" class="body">配置、触发、查询与管理认证</text>
  <text x="100" y="410" class="small">生产托管 Web；开发期使用 Vite</text>
  <rect x="460" y="325" width="380" height="100" rx="12" class="box"/>
  <text x="480" y="359" class="label">计划调度 / 手动触发</text>
  <text x="480" y="388" class="body">来源、流水线、汇报独立计划</text>
  <text x="480" y="410" class="small">任务决策与业务状态由云端掌握</text>
  <path d="M410 373 H460" class="flow"/>

  <rect x="80" y="465" width="330" height="110" rx="12" class="box"/>
  <text x="100" y="500" class="label">来源采集 / Python 解析</text>
  <text x="100" y="531" class="body">抓取 → 解析 → 质量准入</text>
  <text x="100" y="555" class="small">Python 按需子进程，仅云端需要</text>
  <rect x="460" y="465" width="380" height="110" rx="12" class="box"/>
  <text x="480" y="500" class="label">流水线 / AI 任务编排</text>
  <text x="480" y="531" class="body">初审、选文与调研生成 AI 任务</text>
  <text x="480" y="555" class="small">冻结材料、Prompt、Skill 版本与约束</text>
  <path d="M650 425 V465" class="flow"/>
  <path d="M480 425 V445 H245 V465" class="flow"/>

  <rect x="80" y="615" width="330" height="110" rx="12" class="box"/>
  <text x="100" y="650" class="label">SQLite / 文件存储</text>
  <text x="100" y="680" class="body">内容池、运行、日志、业务凭据</text>
  <text x="100" y="704" class="small">数据库在云端；执行机不直接访问</text>
  <rect x="460" y="615" width="380" height="110" rx="12" class="box"/>
  <text x="480" y="650" class="label">AI 队列 / Worker API</text>
  <text x="480" y="680" class="body">任务领取、并发约束、租约与鉴权</text>
  <text x="480" y="704" class="small">ai_jobs 持久化；当前按 profile_id 路由</text>
  <path d="M245 575 V615" class="flow"/>
  <path d="M650 575 V615" class="flow"/>
  <path d="M410 670 H460" class="flow"/>

  <rect x="80" y="780" width="760" height="102" rx="12" class="box"/>
  <text x="100" y="815" class="label">结果校验 / 流水线推进 / 外部交付</text>
  <text x="100" y="845" class="body">保存调用与产物 → GitHub 归档 → 每日研报 / 群汇报</text>
  <text x="100" y="868" class="small">GitHub Token、Webhook 留在云端；AI Runner 只生成并回传结果</text>
  <path d="M650 725 V780" class="return"/>
  <text x="668" y="757" class="small">校验有效结果</text>

  <rect x="1020" y="265" width="530" height="650" rx="20" fill="#edf8f4" stroke="#aad7c8" stroke-width="1.5"/>
  <text x="1048" y="300" class="head">用户电脑 / AI 执行机器</text>
  <rect x="1050" y="325" width="470" height="100" rx="12" class="box"/>
  <text x="1070" y="359" class="label">Codex / Gemini CLI</text>
  <text x="1070" y="388" class="body">按任务启动，完成后退出</text>
  <text x="1070" y="410" class="small">AI 登录、模型配置与授权保留在执行机</text>
  <rect x="1050" y="465" width="470" height="110" rx="12" class="box"/>
  <text x="1070" y="500" class="label">每任务独立工作区</text>
  <text x="1070" y="531" class="body">同步 Skill / 准备材料 / 生成 output 文件</text>
  <text x="1070" y="555" class="small">目录隔离不是操作系统沙箱</text>
  <path d="M1285 465 V425" class="flow"/>
  <rect x="1050" y="615" width="470" height="110" rx="12" class="box"/>
  <text x="1070" y="650" class="label">独立 Runner 常驻进程</text>
  <text x="1070" y="680" class="body">主动领任务 / 心跳续租 / 回传结果与产物</text>
  <text x="1070" y="704" class="small">当前命令名 worker；无需运行 npm run dev</text>
  <path d="M1285 615 V575" class="flow"/>
  <path d="M1050 660 H840" class="flow"/>
  <text x="880" y="640" class="small">主动 HTTPS 请求</text>
  <path d="M840 704 H1050" class="return"/>
  <text x="881" y="738" class="small">任务响应 / 确认</text>
  <rect x="1050" y="780" width="470" height="102" rx="12" fill="#dff0e8"/>
  <text x="1070" y="815" class="label">执行机只运行 Runner 与 AI CLI</text>
  <text x="1070" y="845" class="body">不启动网站、Python 采集器或业务数据库</text>
  <text x="1070" y="868" class="small">当前需源码构建；独立发行包尚未提供</text>

  <rect x="50" y="945" width="1500" height="137" rx="16" fill="#fff8e9" stroke="#e3c784" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="75" y="979" class="label">待实现 · 架构改进，不代表现有能力</text>
  <text x="75" y="1011" class="body">独立 Runner 发行包 / 设备注册与能力路由 / 持久化阶段恢复 / 增量日志 / 显式取消 / 系统服务管理</text>
  <text x="75" y="1043" class="small">当前限制：控制服务重启会中断在途任务；仅有配置级心跳；local / SSH 为辅助拓扑，未画入标准主链路。</text>
  <text x="50" y="1110" class="small">实线：现有调用与数据流。网络请求均由 Runner 主动发起；云端无需连接执行机入站端口。</text>
</svg>
